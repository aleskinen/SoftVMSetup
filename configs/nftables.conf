#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    set blocklist_v4 {
        type ipv4_addr
        flags dynamic, timeout
        timeout 1h
    }

    set blocklist_v6 {
        type ipv6_addr
        flags dynamic, timeout
        timeout 1h
    }

    set cloudflare_v4 {
        type ipv4_addr
        flags interval
    }

    set cloudflare_v6 {
        type ipv6_addr
        flags interval
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop

        ip saddr @blocklist_v4 drop
        ip6 saddr @blocklist_v6 drop

        ip protocol icmp icmp type echo-request limit rate 2/second burst 5 packets accept
        meta l4proto ipv6-icmp icmpv6 type {
            destination-unreachable,
            packet-too-big,
            time-exceeded,
            parameter-problem,
            nd-router-solicit,
            nd-router-advert,
            nd-neighbor-solicit,
            nd-neighbor-advert
        } accept
        meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 2/second burst 5 packets accept

        tcp dport 22 ct state new meter ssh_rate_v4 {
            ip saddr limit rate over 3/minute burst 3 packets
        } add @blocklist_v4 { ip saddr timeout 1h } drop
        tcp dport 22 ct state new meter ssh_rate_v6 {
            ip6 saddr limit rate over 3/minute burst 3 packets
        } add @blocklist_v6 { ip6 saddr timeout 1h } drop
        tcp dport 22 accept

        ip saddr @cloudflare_v4 tcp dport { 80, 443 } accept
        ip6 saddr @cloudflare_v6 tcp dport { 80, 443 } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
